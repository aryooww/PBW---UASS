<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Groceer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8fafc; }
        .navbar-groceer { background: linear-gradient(135deg, #1e7b48, #146c43); }
        .checkout-card { background: white; border-radius: 1rem; }
        .order-summary-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        @media print {
            body * { visibility: hidden; }
            .print-receipt, .print-receipt * { visibility: visible; }
            .print-receipt { position: absolute; top: 0; left: 0; width: 100%; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-groceer text-white px-3 py-3 shadow no-print">
    <div class="container">
        <div class="d-flex align-items-center gap-2" onclick="window.location.href='cart.html'" style="cursor: pointer;"><i class="bi bi-arrow-left fs-5"></i><span class="fw-bold">Kembali ke Keranjang</span></div>
        <div><span class="fw-bold fs-5">Checkout</span></div>
    </div>
</nav>
<div class="container py-4">
    <div class="row">
        <div class="col-lg-7 mb-4">
            <div class="checkout-card p-4 shadow-sm">
                <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt text-success"></i> Alamat Pengiriman</h5>
                <form id="addressForm">
                    <div class="mb-3"><label class="form-label">Nama Penerima <span class="text-danger">*</span></label><input type="text" class="form-control" id="namaPenerima" required></div>
                    <div class="mb-3"><label class="form-label">Nomor Telepon <span class="text-danger">*</span></label><input type="tel" class="form-control" id="noTelepon" required></div>
                    <div class="mb-3"><label class="form-label">Alamat Lengkap <span class="text-danger">*</span></label><textarea class="form-control" id="alamat" rows="3" required></textarea></div>
                    <div class="row"><div class="col-md-6 mb-3"><label class="form-label">Kota <span class="text-danger">*</span></label><input type="text" class="form-control" id="kota" required></div><div class="col-md-6 mb-3"><label class="form-label">Kode Pos <span class="text-danger">*</span></label><input type="text" class="form-control" id="kodePos" required></div></div>
                    <div class="mb-3"><label class="form-label">Catatan (Opsional)</label><textarea class="form-control" id="catatan" rows="2"></textarea></div>
                </form>
            </div>
            <div class="checkout-card p-4 shadow-sm mt-3">
                <h5 class="fw-bold mb-3"><i class="bi bi-truck text-success"></i> Metode Pengambilan</h5>
                <div class="form-check mb-2"><input class="form-check-input" type="radio" name="metodeAmbil" id="ambilSendiri" value="ambil_sendiri" checked><label class="form-check-label" for="ambilSendiri"><i class="bi bi-building"></i> Ambil Sendiri di Toko <small class="d-block text-muted">Jl. Raya Dagang No. 123, Kota</small></label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="metodeAmbil" id="diantar" value="diantar"><label class="form-check-label" for="diantar"><i class="bi bi-truck"></i> Diantar ke Alamat (Gratis Ongkir)</label></div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="checkout-card p-4 shadow-sm">
                <h5 class="fw-bold mb-3"><i class="bi bi-receipt text-success"></i> Ringkasan Pesanan</h5>
                <div id="orderSummary" class="mb-3"></div>
                <hr><div class="d-flex justify-content-between mb-2"><span>Total Item:</span><span class="fw-bold" id="summaryTotalItems">0</span></div>
                <div class="d-flex justify-content-between mb-3"><span>Total Harga:</span><span class="fw-bold text-success fs-5" id="summaryTotalPrice">Rp0</span></div>
                <button class="btn btn-success w-100 py-2 fw-bold" id="confirmOrderBtn"><i class="bi bi-check-circle"></i> Konfirmasi Pesanan</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4">
            <div class="modal-header bg-success text-white"><h5 class="modal-title"><i class="bi bi-receipt"></i> Struk Pembayaran</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-0"><div id="receiptContent" class="print-receipt"></div></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button><button type="button" class="btn btn-primary" id="printReceiptBtn"><i class="bi bi-printer"></i> Cetak Struk</button><button type="button" class="btn btn-success" id="finishOrderBtn"><i class="bi bi-check-circle"></i> Selesai</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let cart = JSON.parse(localStorage.getItem('checkoutCart')) || [];
    if(cart.length===0){ alert('Keranjang kosong!'); window.location.href='cart.html'; }

    function addNotification(msg) { let n = JSON.parse(localStorage.getItem('groceer_notifications')) || []; n.unshift({id:Date.now(), message:msg, time:new Date().toLocaleString(), read:false}); if(n.length>30) n.pop(); localStorage.setItem('groceer_notifications', JSON.stringify(n)); }
    function generateOrderNumber() { let d = new Date(); return `GRC/${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}/${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}/${Math.floor(Math.random()*1000)}`; }
    function formatTanggal() { let d = new Date(); return d.toLocaleDateString('id-ID', {weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'}); }

    function renderOrderSummary() { let totalItems=0, totalPrice=0, html='<div class="list-group list-group-flush">'; cart.forEach(item => { let itemTotal = item.price * item.quantity; totalItems += item.quantity; totalPrice += itemTotal; html += `<div class="list-group-item d-flex gap-2 p-2 border-0 border-bottom"><img src="${item.image}" class="order-summary-img"><div class="flex-grow-1"><h6 class="fw-bold mb-0 small">${item.name}</h6><div class="d-flex justify-content-between"><span class="small">${item.quantity} x Rp${item.price.toLocaleString()}</span><span class="fw-bold small">Rp${itemTotal.toLocaleString()}</span></div></div></div>`; }); html += '</div>'; document.getElementById('orderSummary').innerHTML = html; document.getElementById('summaryTotalItems').innerText = totalItems; document.getElementById('summaryTotalPrice').innerText = 'Rp'+totalPrice.toLocaleString(); }

    function displayReceipt(order) { let itemsHtml = ''; order.items.forEach(item => { itemsHtml += `<tr><td>${item.name} x ${item.quantity}</td><td style="text-align:right;">Rp${(item.price*item.quantity).toLocaleString()}</td></tr>`; }); let metodeText = order.metodeAmbil, alamatText = metodeText==='Ambil Sendiri di Toko' ? 'Ambil Sendiri di Toko\nJl. Raya Dagang No. 123, Kota' : `${order.customer.alamat}\n${order.customer.kota}, ${order.customer.kodePos}`; let html = `<div style="font-family: monospace; padding:20px; max-width:350px; margin:0 auto;"><div style="text-align:center; border-bottom:1px dashed #000;"><h3 style="color:#1e7b48;">GROCEER</h3><p>Grosir Hemat</p></div><div><p><strong>No. Pesanan:</strong> ${order.orderNumber}</p><p><strong>Tanggal:</strong> ${order.tanggal}</p><p><strong>Pemesan:</strong> ${order.customer.nama}</p><p><strong>Telepon:</strong> ${order.customer.telepon}</p><p><strong>Alamat:</strong><br>${alamatText.replace(/\n/g,'<br>')}</p>${order.customer.catatan ? `<p><strong>Catatan:</strong> ${order.customer.catatan}</p>` : ''}<p><strong>Metode:</strong> ${order.metodeAmbil}</p></div><div><table style="width:100%"><thead><tr><th>Produk</th><th>Total</th></tr></thead><tbody>${itemsHtml}</tbody></table></div><div style="border-top:1px dashed #000; margin-top:10px; padding-top:10px;"><div>Total Item: ${order.totalItems} pcs</div><div><strong>Total: Rp${order.totalPrice.toLocaleString()}</strong></div></div><div style="text-align:center; margin-top:20px;"><p>✅ Bayar di toko tunai</p><p>Terima kasih!</p></div></div>`; document.getElementById('receiptContent').innerHTML = html; }

    function finishOrder() { localStorage.removeItem('cart'); localStorage.removeItem('checkoutCart'); window.location.href = 'dashboard.html'; }

    document.getElementById('confirmOrderBtn').onclick = () => { let nama = document.getElementById('namaPenerima').value.trim(); if(!nama){ alert('Nama penerima harus diisi'); return; } let telp = document.getElementById('noTelepon').value.trim(); if(!telp){ alert('Nomor telepon harus diisi'); return; } let alamat = document.getElementById('alamat').value.trim(); if(!alamat){ alert('Alamat harus diisi'); return; } let kota = document.getElementById('kota').value.trim(); if(!kota){ alert('Kota harus diisi'); return; } let kodePos = document.getElementById('kodePos').value.trim(); if(!kodePos){ alert('Kode Pos harus diisi'); return; } let metode = document.querySelector('input[name="metodeAmbil"]:checked').value; let catatan = document.getElementById('catatan').value; let totalItems = cart.reduce((s,i)=>s+i.quantity,0); let totalPrice = cart.reduce((s,i)=>s+(i.price*i.quantity),0); let orderData = { orderNumber: generateOrderNumber(), tanggal: formatTanggal(), customer: { nama, telepon: telp, alamat, kota, kodePos, catatan }, metodeAmbil: metode === 'ambil_sendiri' ? 'Ambil Sendiri di Toko' : 'Diantar ke Alamat', items: [...cart], totalItems, totalPrice, status: 'Menunggu Pembayaran' }; let orderHistory = JSON.parse(localStorage.getItem('orderHistory')) || []; orderHistory.push(orderData); localStorage.setItem('orderHistory', JSON.stringify(orderHistory)); addNotification(`🛍️ Pesanan berhasil! No. ${orderData.orderNumber} - Total Rp${totalPrice.toLocaleString()}`); displayReceipt(orderData); new bootstrap.Modal(document.getElementById('receiptModal')).show(); };
    document.getElementById('printReceiptBtn').onclick = () => { window.print(); };
    document.getElementById('finishOrderBtn').onclick = finishOrder;
    renderOrderSummary();
</script>
</body>
</html>
