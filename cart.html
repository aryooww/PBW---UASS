<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - Groceer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8fafc; }
        .navbar-groceer { background: linear-gradient(135deg, #1e7b48, #146c43); }
        .cart-item-img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; }
        .qty-btn { background: #e9ecef; border: none; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
<nav class="navbar navbar-groceer text-white px-4 py-3 shadow">
    <div class="container-fluid d-flex justify-content-between">
        <div class="d-flex gap-2 align-items-center" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">
            <i class="bi bi-basket3 fs-3"></i>
            <span class="fw-bold fs-4">Groceer</span>
        </div>
        <div class="d-flex gap-3">
            <i class="bi bi-bell fs-5" style="cursor:pointer" onclick="window.location.href='notifications.html'"></i>
            <i class="bi bi-person-circle fs-5" style="cursor:pointer" onclick="window.location.href='profile.html'"></i>
            <i class="bi bi-box-arrow-right fs-5" style="cursor:pointer" id="logoutBtn"></i>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h3 class="fw-bold mb-4"><i class="bi bi-cart3 text-success me-2"></i> Keranjang Belanja</h3>
    <div id="cartContainer" class="row g-4"><div class="col-12 text-center py-5 text-muted">Memuat keranjang...</div></div>
    <div class="row mt-4 d-none" id="summaryRow">
        <div class="col-md-6 offset-md-6">
            <div class="card border-0 shadow-sm p-3">
                <h5>Ringkasan Belanja</h5>
                <div class="d-flex justify-content-between mt-2"><span>Subtotal</span><span id="subtotal">Rp0</span></div>
                <hr><div class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span id="totalDisplay">Rp0</span></div>
                <button class="btn btn-success w-100 mt-3 rounded-pill" id="checkoutBtn">Checkout Sekarang</button>
                <a href="dashboard.html" class="btn btn-outline-secondary w-100 mt-2 rounded-pill">← Lanjutkan Belanja</a>
            </div>
        </div>
    </div>
</div>

<!-- Modal Struk Checkout -->
<div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="bi bi-receipt"></i> Pesanan Berhasil</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="checkoutStruk"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                <button type="button" class="btn btn-success" id="backToShopBtn">Kembali Belanja</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ==================== FUNGSI KERANJANG ====================
    function getCart() { return JSON.parse(localStorage.getItem('groceer_cart')) || []; }
    function saveCart(c) { localStorage.setItem('groceer_cart', JSON.stringify(c)); }
    
    function addNotification(message) {
        let notifs = JSON.parse(localStorage.getItem('groceer_notifications')) || [];
        notifs.unshift({ id: Date.now(), message: message, time: new Date().toLocaleString(), read: false });
        if (notifs.length > 30) notifs.pop();
        localStorage.setItem('groceer_notifications', JSON.stringify(notifs));
    }
    
    function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Render keranjang
    function renderCart() {
        let cart = getCart();
        let container = document.getElementById('cartContainer');
        let summary = document.getElementById('summaryRow');
        if (cart.length === 0) {
            container.innerHTML = `<div class="col-12 text-center py-5"><i class="bi bi-cart-x fs-1 text-muted"></i><p class="mt-3">Keranjang kosong.</p><a href="dashboard.html" class="btn btn-success rounded-pill">Belanja Sekarang</a></div>`;
            summary.classList.add('d-none');
            return;
        }
        summary.classList.remove('d-none');
        let html = '';
        let subtotal = 0;
        cart.forEach(item => {
            let itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            html += `
                <div class="col-12 border-bottom pb-3 mb-3">
                    <div class="d-flex gap-3 align-items-center flex-wrap">
                        <img src="${item.image || 'https://picsum.photos/80/80'}" class="cart-item-img" alt="${escapeHtml(item.name)}">
                        <div class="flex-grow-1">
                            <h6 class="mb-0 fw-bold">${escapeHtml(item.name)}</h6>
                            <small class="text-secondary">Rp${item.price.toLocaleString()}</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="qty-btn dec-qty" data-id="${item.id}">-</button>
                            <span class="fw-bold mx-2" id="qty-${item.id}">${item.quantity}</span>
                            <button class="qty-btn inc-qty" data-id="${item.id}">+</button>
                        </div>
                        <div class="fw-bold text-success">Rp${itemTotal.toLocaleString()}</div>
                        <button class="btn btn-sm btn-outline-danger remove-item" data-id="${item.id}"><i class="bi bi-trash3"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        document.getElementById('subtotal').innerText = 'Rp' + subtotal.toLocaleString();
        document.getElementById('totalDisplay').innerText = 'Rp' + subtotal.toLocaleString();
        
        // Event listeners untuk tombol qty dan hapus
        document.querySelectorAll('.dec-qty').forEach(btn => {
            btn.onclick = () => changeQty(btn.dataset.id, -1);
        });
        document.querySelectorAll('.inc-qty').forEach(btn => {
            btn.onclick = () => changeQty(btn.dataset.id, 1);
        });
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.onclick = () => removeItem(btn.dataset.id);
        });
    }
    
    function changeQty(id, delta) {
        let cart = getCart();
        let idx = cart.findIndex(i => i.id == id);
        if (idx >= 0) {
            cart[idx].quantity += delta;
            if (cart[idx].quantity <= 0) cart.splice(idx, 1);
            saveCart(cart);
            renderCart();
        }
    }
    
    function removeItem(id) {
        let cart = getCart().filter(i => i.id != id);
        saveCart(cart);
        renderCart();
    }
    
    // Proses checkout: kosongkan keranjang, catat pesanan, tampilkan modal, tambah notifikasi
    function checkout() {
        let cart = getCart();
        if (cart.length === 0) {
            alert('Keranjang kosong!');
            return;
        }
        
        // Hitung total dan buat struk
        let subtotal = 0;
        let itemsHtml = '';
        cart.forEach(item => {
            let itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            itemsHtml += `<li><strong>${escapeHtml(item.name)}</strong> x ${item.quantity} = Rp${itemTotal.toLocaleString()}</li>`;
        });
        
        // Buat struk
        let struk = `
            <div class="border-bottom pb-2 mb-2">
                <h6>Struk Pesanan</h6>
                <small>${new Date().toLocaleString()}</small>
            </div>
            <ul class="list-unstyled">${itemsHtml}</ul>
            <hr>
            <div class="d-flex justify-content-between fw-bold">
                <span>Total</span>
                <span>Rp${subtotal.toLocaleString()}</span>
            </div>
            <div class="alert alert-success mt-2">
                <i class="bi bi-check-circle"></i> Pembayaran berhasil! Pesanan akan segera diproses.
            </div>
        `;
        document.getElementById('checkoutStruk').innerHTML = struk;
        
        // Tambahkan notifikasi
        addNotification(`🛍️ Pesanan berhasil! Total ${cart.length} item - Rp${subtotal.toLocaleString()}`);
        
        // Kosongkan keranjang SEKARANG (sebelum modal ditampilkan)
        saveCart([]);
        renderCart(); // Langsung update tampilan keranjang menjadi kosong
        
        // Tampilkan modal
        let modal = new bootstrap.Modal(document.getElementById('checkoutModal'));
        modal.show();
        
        // Optional: jika user menutup modal atau klik kembali belanja, keranjang sudah kosong
    }
    
    // ==================== AUTENTIKASI ====================
    function checkAuth() {
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'Tampilanlogin.html';
        }
    }
    
    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userData');
        window.location.href = 'Tampilanlogin.html';
    };
    
    // Tombol "Kembali Belanja" di modal
    document.getElementById('backToShopBtn').onclick = () => {
        window.location.href = 'dashboard.html';
    };
    
    document.getElementById('checkoutBtn').onclick = checkout;
    
    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        renderCart();
    });
</script>
</body>
</html>
