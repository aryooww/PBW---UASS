<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi - Groceer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f1f5f9; }
        .navbar-groceer { background: linear-gradient(135deg, #1e7b48, #146c43); }
        .notif-item { transition: 0.2s; }
        .notif-item:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>
<nav class="navbar navbar-groceer text-white px-4 py-3 shadow">
    <div class="container-fluid d-flex justify-content-between">
        <div class="d-flex gap-2 align-items-center" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">
            <i class="bi bi-basket3 fs-3"></i>
            <span class="fw-bold fs-4">Groceer</span>
        </div>
        <div class="d-flex gap-3">
            <i class="bi bi-cart3 fs-5" style="cursor:pointer" onclick="window.location.href='cart.html'"></i>
            <i class="bi bi-person-circle fs-5" style="cursor:pointer" onclick="window.location.href='profile.html'"></i>
            <i class="bi bi-box-arrow-right fs-5" style="cursor:pointer" id="logoutBtn"></i>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <h3 class="fw-bold"><i class="bi bi-bell-fill text-warning me-2"></i> Notifikasi</h3>
        <button id="clearNotifBtn" class="btn btn-sm btn-outline-secondary">Hapus Semua</button>
    </div>
    <div id="notifList" class="mt-4"></div>
</div>

<script>
    function getNotifications() { return JSON.parse(localStorage.getItem('groceer_notifications')) || []; }
    function saveNotifications(notifs) { localStorage.setItem('groceer_notifications', JSON.stringify(notifs)); }
    
    function renderNotifications() {
        let notifs = getNotifications();
        let container = document.getElementById('notifList');
        if(notifs.length === 0) {
            container.innerHTML = '<div class="alert alert-light text-center">Belum ada notifikasi.</div>';
            return;
        }
        let html = '<div class="list-group">';
        notifs.forEach(n => {
            let isReadClass = n.read ? 'bg-white' : 'bg-light border-start border-success border-3';
            html += `<div class="list-group-item list-group-item-action ${isReadClass} d-flex justify-content-between align-items-start rounded-3 mb-2 shadow-sm">
                        <div>
                            <i class="bi bi-info-circle-fill text-success me-2"></i>
                            <strong>${escapeHtml(n.message)}</strong><br>
                            <small class="text-muted">${n.time}</small>
                        </div>
                    </div>`;
        });
        html += '</div>';
        container.innerHTML = html;
        // Tandai semua notifikasi sebagai sudah dibaca
        let updated = false;
        notifs.forEach(n => { if(!n.read) { n.read = true; updated = true; } });
        if(updated) saveNotifications(notifs);
    }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }
    
    document.getElementById('clearNotifBtn')?.addEventListener('click', () => {
        saveNotifications([]);
        renderNotifications();
    });
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userData');
        window.location.href = 'Tampilanlogin.html';
    });
    if(localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'Tampilanlogin.html';
    renderNotifications();
</script>
</body>
</html>
